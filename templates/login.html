{% extends "base.html" %}
{% block title %}Login - BST Internship{% endblock %}
{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <h1>Login</h1>
        <p class="muted">Continue your internship quest.</p>

        <form method="post">
            <label>Email</label>
            <input name="email" type="email" required>

            <label>Password</label>
            <input name="password" type="password" required>

            <button class="main-cta full" type="submit">Login</button>
        </form>

        <div class="hint-box">
            <strong>Admin login</strong><br>
            Email: admin@bst.local<br>
            Password: admin123
        </div>

        <p class="muted">New student? <a class="blue-text" href="/register">Create account</a></p>
    </div>
</section>
{% endblock %}
